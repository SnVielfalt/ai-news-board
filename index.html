<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NAIS｜理論研究者のためのAIニュース掲示板</title>
<meta name="description" content="理論・計算研究者のための週刊AIニュース。研究・環境・計画・キャリアの見直しにつながる記事を厳選。">
<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13161c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NAIS">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261114-3">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <svg class="mast-bg" viewBox="0 0 512 512" aria-hidden="true" focusable="false">
      <path d="M150 360 C150 250 210 190 256 190 C302 190 362 250 362 360" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round"/>
      <circle cx="256" cy="150" r="30" fill="currentColor"/>
      <path d="M120 400 H392" stroke="currentColor" stroke-width="18" stroke-linecap="round"/>
    </svg>
    <div class="mast-row">
      <img class="mast-icon" src="assets/icon.svg" alt="" width="52" height="52">
      <div class="mast-text">
        <span class="kicker" id="kicker"></span>
        <h1 id="siteTitle">理論研究者のためのAIニュース掲示板</h1>
      </div>
    </div>
    <p id="siteDesc"></p>
  </header>

  <nav class="issues" id="issues" aria-label="号を選ぶ"></nav>
  <section class="issue-head" id="issueHead"><div class="notice">読み込み中です…</div></section>
  <div class="filters" id="filters" hidden></div>
  <main class="list" id="list"></main>

  <footer>
    <h2>使い方</h2>
    <ul id="howto">
      <li>各記事の「詳しく ＋」で、背景や数字の詳細が読めます。</li>
      <li>記事には「気になる」「ショック」などのリアクションと、GitHubアカウントでのコメントを残せます。</li>
      <li>各号の「耳で聴く」は約5分の音声版です。ポッドキャストアプリに登録すると毎週自動で届きます。音声：VOICEVOX:四国めたん、VOICEVOX:ずんだもん</li>
      <li>スマホでは、ブラウザの共有メニューから「ホーム画面に追加」するとアプリのように開けます。</li>
    </ul>
  </footer>
</div>
<script src="assets/app.js?v=20261114-3"></script>
</body>
</html>
