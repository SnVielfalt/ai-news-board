name: 号の誤情報チェック

on:
  push:
    branches: [main]
    paths:
      - "issues/*.json"
      - "tools/check_issue.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台帳と出典のチェック
        run: |
          status=0
          for f in issues/*.json; do
            case "$f" in *.facts.json|*.radio.json|issues/index.json) continue;; esac
            python3 tools/check_issue.py "$f" || status=1
          done
          exit $status
