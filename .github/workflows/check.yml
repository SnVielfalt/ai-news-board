name: 号の誤情報チェック

on:
  push:
    branches: [main]
    paths:
      - "issues/*.json"
      - "daily/issues/*.json"
      - "calendar.json"
      - "tools/check_issue.py"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 台帳と出典のチェック
        run: |
          status=0
          for f in issues/*.json daily/issues/*.json; do
            case "$f" in *.facts.json|*.radio.json|*/index.json) continue;; esac
            python3 tools/check_issue.py "$f" || status=1
          done
          if [ -f calendar.json ]; then python3 tools/check_calendar.py calendar.json || status=1; fi
          exit $status
